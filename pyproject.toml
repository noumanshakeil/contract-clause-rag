[project]
name = "contract-clause-rag"
version = "2.0.0"
description = "Contract clause finder with risk tags, severity scoring, and citation-backed answers for legal/ops review loops."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
